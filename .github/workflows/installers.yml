name: Build launcher installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www_posim_autonomy/**', 'pyproject.toml', 'tools/**', 'packaging/**', '.github/workflows/installers.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.3.0 pyinstaller==6.16.0
      - run: python tools/build_installer.py wheel
      - run: python tools/build_installer.py desktop
      - if: runner.os == 'Linux'
        run: python tools/build_installer.py deb
      - if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: www-posim-client-${{ runner.os }}
          path: dist/
